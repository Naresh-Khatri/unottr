# all native deps ship N-API prebuilds; rebuilding would break Node-side tests
npmRebuild: false

appId: dev.unottr.app
productName: unottr
copyright: unottr contributors
directories:
  output: release

files:
  - out/**
  # db/migrate.ts resolves ../../drizzle off out/main at runtime
  - drizzle/**
  - package.json
  # no broad **/ ignores: electron-builder applies them inside dependencies too
  # Linux keeps Vulkan plus its plain fallback; CUDA and browser WASM are unused
  - "!node_modules/@fugood/node-whisper-linux-x64-cuda/**"
  - "!node_modules/@fugood/node-whisper-wasm/**"
  # prebuilt only; vendored whisper.cpp feeds source builds
  - "!node_modules/@fugood/whisper.node/whisper.cpp/**"
  # npmRebuild is off; keep only the host SQLite prebuild
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"

# native addons, adjacent libraries, and migrations must stay outside asar
asarUnpack:
  - "**/*.node"
  - drizzle/**
  - node_modules/better-sqlite3/**

extraResources:
  - from: resources/icons
    to: icons
  - from: THIRD-PARTY.md
    to: THIRD-PARTY.md

linux:
  target: [AppImage]
  category: AudioVideo
  files:
    - "!node_modules/better-sqlite3/prebuilds/darwin-*"
    - "!node_modules/better-sqlite3/prebuilds/win32-*"
    - "!node_modules/better-sqlite3/prebuilds/linuxmusl-*"
    - "!node_modules/better-sqlite3/prebuilds/linux-arm64.node"
  asarUnpack:
    - node_modules/sherpa-onnx-linux-x64/**
    - node_modules/@fugood/node-whisper-linux-x64-vulkan/**
  extraResources:
    - from: resources/bin
      to: bin
      filter: ["ffmpeg", "ffprobe", "ffmpeg-LICENSE.txt"]
    - from: resources/bin/sortformer
      to: bin/sortformer
  # AppRun adds this location before the native addon loads
  extraFiles:
    - from: resources/lib/libvulkan.so.1
      to: libvulkan.so.1
  # UI is English-only; other locale packs add 12 MB
  electronLanguages: [en-US]
  icon: resources/icons
  synopsis: Local transcription of screen recordings
  description: >-
    Watches folders for recordings, transcribes and diarizes them on this machine,
    and keeps everything searchable. Nothing leaves the device.
  desktop:
    entry:
      Terminal: "false"
      Type: Application

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

mac:
  target:
    - target: dir
      arch: [arm64]
    - target: zip
      arch: [arm64]
  minimumSystemVersion: 15.0.0
  category: public.app-category.utilities
  icon: resources/icons/icon.icns
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  electronLanguages: [en-US]
  artifactName: ${productName}-${version}-${arch}.${ext}
  files:
    - "!node_modules/@fugood/node-whisper-linux-*/**"
    - "!node_modules/@fugood/node-whisper-darwin-x64/**"
    - "!node_modules/sherpa-onnx-linux-*/**"
    - "!node_modules/sherpa-onnx-darwin-x64/**"
    - "!node_modules/better-sqlite3/prebuilds/linux*"
    - "!node_modules/better-sqlite3/prebuilds/win32-*"
    - "!node_modules/better-sqlite3/prebuilds/darwin-x64.node"
  asarUnpack:
    - node_modules/sherpa-onnx-darwin-arm64/**
    - node_modules/@fugood/node-whisper-darwin-arm64/**
  extraResources:
    - from: resources/bin/darwin-arm64
      to: bin/darwin-arm64
