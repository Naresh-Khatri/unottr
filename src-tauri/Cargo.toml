[package]
name = "unottr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local, private meeting transcription with speaker diarization."

[lib]
name = "unottr_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
unottr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon", "protocol-asset"] }
# same version unottr-core uses; features unify across the workspace build
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
tempfile = "3.27.0"
