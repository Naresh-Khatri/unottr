name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore annotated tag object
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Check tag, version, and release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.1.0." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "v${package_version}" ]]; then
            echo "Tag $tag does not match package.json version ${package_version}." >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "Release tags must be annotated so their message can become the changelog." >&2
            exit 1
          fi

          notes="$(git for-each-ref --format='%(contents:body)' "refs/tags/$tag")"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "The annotated tag must have a message body containing the changelog." >&2
            exit 1
          fi

  linux:
    name: Build Linux x64 AppImage
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake glslc libvulkan-dev libvulkan1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Linux runtimes
        run: |
          ./scripts/fetch-ffmpeg.sh
          ./scripts/fetch-vulkan-loader.sh
          ./scripts/fetch-sortformer-runtime.sh

      - name: Check source and native dependencies
        run: |
          pnpm typecheck
          pnpm test
          pnpm smoke:native

      - name: Package AppImage
        run: pnpm dist --linux AppImage --x64

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.AppImage)
          if (( ${#files[@]} != 1 )); then
            echo "Expected one AppImage, found ${#files[@]}." >&2
            exit 1
          fi
          cd release
          sha256sum "$(basename "${files[0]}")" > "$(basename "${files[0]}").sha256"

      - name: Store Linux release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS arm64 zip
    needs: validate
    runs-on: macos-14
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require an Apple Silicon runner
        shell: bash
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS release requires an Apple Silicon runner." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage macOS resources
        run: |
          pnpm stage:macos:icon
          pnpm stage:macos:ffmpeg

      - name: Check source and native dependencies
        run: |
          pnpm typecheck
          pnpm test
          pnpm smoke:native

      - name: Package ad-hoc signed macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm dist --mac --arm64

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.zip)
          if (( ${#files[@]} != 1 )); then
            echo "Expected one macOS zip, found ${#files[@]}." >&2
            exit 1
          fi
          cd release
          shasum -a 256 "$(basename "${files[0]}")" > "$(basename "${files[0]}").sha256"

      - name: Store macOS release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tag and changelog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Restore annotated tag object
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Download Linux files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release
          path: artifacts/linux

      - name: Download macOS files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release
          path: artifacts/macos

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' release_files < <(find artifacts -type f -print0 | sort -z)
          if (( ${#release_files[@]} != 4 )); then
            echo "Expected four release files, found ${#release_files[@]}." >&2
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Downloads"
            echo
            echo "- Linux x64: download the \`.AppImage\`, make it executable, and run it."
            echo "- Apple Silicon Mac: download the \`-arm64.zip\` and move \`unottr.app\` to Applications."
            echo "- The Mac app is ad-hoc signed and not notarized. Control-click it and choose Open the first time."
            echo "- Use the matching \`.sha256\` file to verify a download."
            echo
            echo "## Changes"
            echo
            git for-each-ref --format='%(contents:body)' "refs/tags/${GITHUB_REF_NAME}"
          } > "$notes_file"

          release_args=(
            "${GITHUB_REF_NAME}"
            --verify-tag
            --title "${GITHUB_REF_NAME}"
            --notes-file "$notes_file"
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes_file"
            gh release upload "${GITHUB_REF_NAME}" "${release_files[@]}" --clobber
          else
            gh release create "${release_args[@]}" "${release_files[@]}"
          fi
